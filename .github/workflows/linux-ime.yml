name: Linux IME

on:
  # Informational only. macOS CI remains the sole required merge/release gate
  # (see PR #31 / RELEASE-REFERENCE.md). Do not add these jobs to the
  # branch-protection required checks.
  pull_request:
    branches: [main]
    paths:
      - "platforms/linux/**"
      - "rime-data/**"
      - "scripts/platform-preview/**"
      - ".github/workflows/linux-ime.yml"
  push:
    branches: [main]
    paths:
      - "platforms/linux/**"
      - "rime-data/**"
      - "scripts/platform-preview/**"
      - ".github/workflows/linux-ime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    name: Fcitx5 addon + headless typing
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential g++ cmake extra-cmake-modules pkg-config gettext \
            libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev \
            fcitx5-modules-dev fcitx5 fcitx5-modules \
            fcitx5-frontend-gtk3 fcitx5-frontend-qt5 \
            librime-dev librime-plugin-lua librime-bin \
            libopencc-dev libopencc-data \
            xvfb xdotool dbus-x11 \
            python3-gi gir1.2-gtk-3.0 libgtk-3-dev \
            qtbase5-dev fonts-noto-cjk weston wtype

      - name: Build
        run: platforms/linux/ime/scripts/build.sh

      - name: Unit tests
        run: ctest --test-dir platforms/linux/ime/build --output-on-failure

      - name: Headless typing E2E
        run: platforms/linux/ime/tests/e2e/e2e.sh --build-dir platforms/linux/ime/build

      - name: Existing Linux data-package smoke still passes
        run: platforms/linux/tests/smoke.sh

      - name: Upload unsigned addon (not a release asset)
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: RIMES-Linux-IME-UNSIGNED-${{ github.sha }}
          path: |
            platforms/linux/ime/build/rimes.so
            platforms/linux/ime/build/rimes.conf
            platforms/linux/ime/build/rimes-addon.conf
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
