name: iOS checks
on:
  pull_request:
    paths: ['Shared/**', 'platforms/ios/**', 'Sources/RimeBuffer/ChordOutputEncoding.swift', 'chord-keymaps/**', '.github/workflows/ios*.yml']
  push:
    branches: [main, "codex/ios-*"]
    paths: ["Shared/**", "platforms/ios/**", "Sources/RimeBuffer/ChordOutputEncoding.swift", "chord-keymaps/**", ".github/workflows/ios*.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9
        with:
          ruby-version: '3.3'
          working-directory: platforms/ios
          bundler-cache: true
      - name: Validate Fastlane without signing credentials
        working-directory: platforms/ios
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: |
          ruby scripts/tests/release-config-test.rb
          bundle exec fastlane lanes
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and test without device credentials
        run: platforms/ios/scripts/build.sh
      - name: Test release configuration and hosted iOS tests
        run: |
          ruby platforms/ios/scripts/tests/release-config-test.rb
          platforms/ios/scripts/test-simulator.sh
      - name: Verify resources
        run: python3 platforms/ios/scripts/verify.py
      - name: Build signing-free Release device app
        run: |
          xcodebuild -project platforms/ios/RIMES.xcodeproj -scheme RIMES -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath platforms/ios/build/ReleaseDeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          APP=$(find platforms/ios/build/ReleaseDeviceDerivedData/Build/Products -type d -name 'RIMES.app' | head -n 1)
          test -n "$APP" || { echo 'RIMES.app not found in device build products'; exit 1; }
          VER="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p platforms/ios/build/ipa/Payload
          cp -R "$APP" platforms/ios/build/ipa/Payload/RIMES.app
          for PL in platforms/ios/build/ipa/Payload/RIMES.app/Info.plist \
                    platforms/ios/build/ipa/Payload/RIMES.app/PlugIns/RIMESKeyboard.appex/Info.plist; do
            [ -f "$PL" ] || continue
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" "$PL"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" "$PL"
          done
          (cd platforms/ios/build/ipa && zip -qry "RIMES-${VER}-unsigned.ipa" Payload)
          # Verify the artifact, not just the build: a Debug device build carries the
          # code in RIMES.debug.dylib behind a ~70 KB stub, which sideloads badly.
          test -f platforms/ios/build/ipa/Payload/RIMES.app/PlugIns/RIMESKeyboard.appex/Info.plist \
            || { echo 'keyboard appex missing from IPA'; exit 1; }
          test ! -e platforms/ios/build/ipa/Payload/RIMES.app/RIMES.debug.dylib \
            || { echo 'unexpected debug dylib in Release build'; exit 1; }
          SIZE=$(/usr/bin/stat -f%z platforms/ios/build/ipa/Payload/RIMES.app/RIMES)
          echo "main binary: $SIZE bytes"
          [ "$SIZE" -gt 1000000 ] || { echo 'main binary too small for a Release build'; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' platforms/ios/build/ipa/Payload/RIMES.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' platforms/ios/build/ipa/Payload/RIMES.app/PlugIns/RIMESKeyboard.appex/Info.plist
          /usr/bin/unzip -l platforms/ios/build/ipa/*.ipa | tail -n 3
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RIMES-unsigned-ipa
          path: platforms/ios/build/ipa/*.ipa
          if-no-files-found: error
